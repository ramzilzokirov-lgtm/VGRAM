name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Rename app and set version
        run: |
          find TMessagesProj/src/main/res -name 'strings*.xml' -exec sed -i -E 's|(<string name="AppName(Beta)?"[^>]*>)[^<]*|\1VGRAM|' {} +
          sed -i -E 's/^APP_VERSION_NAME=.*/APP_VERSION_NAME=0.1/' gradle.properties
          grep -rn 'name="AppName' TMessagesProj/src/main/res/values/ || true
          grep -n 'APP_VERSION' gradle.properties || true
      - name: Apply VGRAM icon
        continue-on-error: true
        run: |
          test -f vgram-icon.png || { echo "vgram-icon.png not found in repo root"; exit 1; }
          pip install pillow
          python3 - <<'PY'
          import os, re
          from PIL import Image

          SRC = "vgram-icon.png"
          SKIP = ("/build/", "/.git/", "/.gradle/")
          DENS = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}

          names, res_dirs = set(), set()
          for root, dirs, files in os.walk("."):
              r = root.replace("\\", "/") + "/"
              if any(s in r for s in SKIP):
                  continue
              if "AndroidManifest.xml" in files:
                  t = open(os.path.join(root, "AndroidManifest.xml"), encoding="utf-8", errors="ignore").read()
                  found = re.findall(r'android:(?:icon|roundIcon)="@mipmap/(\w+)"', t)
                  names |= set(re.sub(r"_round$", "", n) for n in found)
              if r.rstrip("/").endswith("/res") and "/src/" in r:
                  res_dirs.add(os.path.normpath(root))

          print("icon names in manifests:", sorted(names))
          if not names:
              print("No @mipmap icons found, nothing to do")
              raise SystemExit(0)

          src = Image.open(SRC).convert("RGBA")

          def save(path, px):
              src.resize((px, px), Image.LANCZOS).save(path)

          changed = 0
          for name in sorted(names):
              stems = (name, name + "_round")
              targets = set()
              for res in res_dirs:
                  for d in os.listdir(res):
                      if not d.startswith("mipmap-"):
                          continue
                      dp = os.path.join(res, d)
                      for f in os.listdir(dp):
                          stem, ext = os.path.splitext(f)
                          if stem not in stems:
                              continue
                          targets.add(res)
                          p = os.path.join(dp, f)
                          if ext == ".png":
                              with Image.open(p) as old:
                                  px = max(old.size)
                              save(p, px)
                              changed += 1
                          else:
                              os.remove(p)  # xml / webp would shadow the new png
                              changed += 1
              if not targets and os.path.isdir("TMessagesProj/src/main/res"):
                  targets.add("TMessagesProj/src/main/res")
              for res in targets:
                  for dens, px in DENS.items():
                      d = os.path.join(res, "mipmap-" + dens)
                      os.makedirs(d, exist_ok=True)
                      for n in stems:
                          save(os.path.join(d, n + ".png"), px)
              print("replaced icon:", name, "in", sorted(targets))
          print("files touched:", changed)
          PY
      - name: Add Developers button
        continue-on-error: true
        run: |
          if [ -f VgramDevelopersActivity.java ]; then cp VgramDevelopersActivity.java TMessagesProj/src/main/java/org/telegram/ui/; fi
          test -f TMessagesProj/src/main/java/org/telegram/ui/VgramDevelopersActivity.java || { echo "VgramDevelopersActivity.java not found"; exit 1; }
          python3 - <<'PY'
          import re, sys

          P = "TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java"
          s = open(P, encoding="utf-8").read()

          print("== lines with policyRow (for diagnostics) ==")
          for i, line in enumerate(s.splitlines(), 1):
              if "policyRow" in line:
                  print(i, line.strip()[:150])

          if "vgramDevRow" in s:
              print("already patched")
              sys.exit(0)

          ok = {}
          t = s

          def sub1(name, pattern, repl):
              global t
              t, n = re.subn(pattern, repl, t, count=1)
              ok[name] = n

          sub1("decl", r"(\n[ \t]*private int policyRow;)", r"\1\n    private int vgramDevRow;")
          sub1("assign", r"(\n([ \t]*)policyRow = rowCount\+\+;)", r"\1\n\2vgramDevRow = rowCount++;")
          sub1("reset", r"(\n([ \t]*)policyRow = -1;)", r"\1\n\2vgramDevRow = -1;")
          sub1("click", r"(\} else if \(position == policyRow\) \{)(\s*Browser\.openUrl)",
               r"} else if (position == vgramDevRow) {\n                presentFragment(new VgramDevelopersActivity());\n            \1\2")
          sub1("bind", r"(\} else if \(position == policyRow\) \{)(\s*textCell\.setText)",
               r'} else if (position == vgramDevRow) {\n                textCell.setText("Разработчики", false);\n            \1\2')

          n_or1 = t.count("|| position == policyRow")
          t = t.replace("|| position == policyRow", "|| position == policyRow || position == vgramDevRow")
          t, n_or2 = re.subn(r"(?<!\|\| )position == policyRow \|\|", "position == vgramDevRow || position == policyRow ||", t)
          ok["viewtype"] = n_or1 + n_or2

          print("== patch checks ==", ok)
          required = ["decl", "assign", "click", "bind", "viewtype"]
          if all(ok[k] >= 1 for k in required):
              open(P, "w", encoding="utf-8").write(t)
              print("PATCH APPLIED")
          else:
              print("PATCH SKIPPED (anchors not found), ProfileActivity.java left untouched")
          PY
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/build/outputs/apk/**/*.apk"
