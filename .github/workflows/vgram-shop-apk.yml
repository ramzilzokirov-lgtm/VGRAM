name: VGRAM Shop APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'vgram-shop-android/**'
      - '.github/workflows/vgram-shop-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: vgram-shop-android
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VGRAM-Shop-APK
          path: vgram-shop-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
